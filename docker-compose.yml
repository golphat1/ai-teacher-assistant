services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ata_user
      POSTGRES_PASSWORD: ata_password
      POSTGRES_DB: ata_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: ./backend
    env_file: ./backend/.env
    depends_on:
      - db
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata: